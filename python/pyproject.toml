[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-format-import"
version = "0.1.0"
description = "Standalone Zemax and OSLO prescription parsers and normalized JSON"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.scripts]
optical-import = "optical_import.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
